<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动作演示界面</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                <i class="fas fa-video"></i>
                <h1>动作演示</h1>
            </div>
            <div class="sequence-selector">
                <label for="sequence-select"><i class="fas fa-list-ul"></i> 选择动作序列:</label>
                <select id="sequence-select">
                    <option value="">-- 请选择 --</option>
                </select>
            </div>
        </div>

        <!-- 全屏倒计时覆盖层 -->
        <div id="fullscreen-countdown" class="fullscreen-overlay hidden">
            <div class="countdown-content">
                <div id="countdown-title">准备采集</div>
                <div id="countdown-timer">3</div>
                <div id="countdown-message">请准备好执行动作</div>
            </div>
        </div>

        <div class="main-content">
            <div class="video-section">
                <div class="video-container">
                    <video id="motion-video" controls>
                        <source src="" type="video/mp4">
                        您的浏览器不支持视频播放。
                    </video>

                    <div id="collection-overlay" class="collection-overlay hidden">
                        <div class="overlay-content">
                            <div id="overlay-status">准备采集</div>
                            <div id="overlay-message">请准备好执行动作</div>
                        </div>
                    </div>
                </div>

                <div class="video-controls">
                    <button id="prev-btn" disabled><i class="fas fa-step-backward"></i> 上一个</button>
                    <button id="play-btn"><i class="fas fa-play"></i> 播放</button>
                    <button id="next-btn" disabled><i class="fas fa-step-forward"></i> 下一个</button>
                </div>
            </div>

            <div class="info-panel">
                <div class="motion-info">
                    <h2 id="motion-name"><i class="fas fa-info-circle"></i> 请选择动作</h2>
                    <p id="motion-description"></p>
                </div>

                <div class="key-points">
                    <h3><i class="fas fa-key"></i> 关键点:</h3>
                    <ul id="key-points-list"></ul>
                </div>

                <div class="sequence-progress">
                    <h3><i class="fas fa-tasks"></i> 序列进度:</h3>
                    <div id="progress-bar">
                        <div id="progress-indicator"></div>
                    </div>
                    <div id="sequence-steps"></div>
                </div>

                <div id="collection-progress" class="collection-progress hidden">
                    <h3><i class="fas fa-chart-line"></i> 采集进度:</h3>
                    <div class="progress-info">
                        <span id="current-repeat">0</span> / <span id="total-repeats">5</span> 次
                    </div>
                    <div class="collection-status">
                        状态: <span id="collection-state">准备中</span>
                    </div>
                </div>

                <div class="collection-controls">
                    <button id="prepare-collection-btn"><i class="fas fa-clipboard-check"></i> 准备采集</button>
                    <button id="start-collection-btn" disabled><i class="fas fa-play-circle"></i> 开始采集</button>
                    <button id="stop-collection-btn" disabled><i class="fas fa-stop-circle"></i> 停止采集</button>
                    <button id="finish-collection-btn" disabled><i class="fas fa-check-circle"></i> 完成采集</button>
                </div>
            </div>
        </div>

        <div class="status-panel">
            <i class="fas fa-info-circle"></i>
            <div id="status-message">就绪</div>
        </div>

        <footer class="footer">
            <p>© 2025 动作演示界面| <i class="fas fa-code"></i> 版本 1.0</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
