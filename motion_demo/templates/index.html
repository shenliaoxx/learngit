<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动作演示与数据采集系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>动作演示与数据采集系统</h1>
            <div class="sequence-selector">
                <label for="sequence-select">选择动作序列:</label>
                <select id="sequence-select">
                    <option value="">-- 请选择 --</option>
                </select>
            </div>
        </div>

        <div class="main-content">
            <div class="video-container">
                <video id="motion-video" controls>
                    <source src="" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>

                <div id="collection-overlay" class="collection-overlay hidden">
                    <div class="overlay-content">
                        <div id="overlay-status">准备采集</div>
                        <div id="overlay-timer" class="timer-large">3</div>
                        <div id="overlay-message">请准备好执行动作</div>
                    </div>
                </div>
            </div>

            <div class="info-panel">
                <div class="motion-info">
                    <h2 id="motion-name">请选择动作</h2>
                    <p id="motion-description"></p>
                    <div class="timer">
                        <span id="timer-label">倒计时:</span>
                        <span id="timer-value">0</span>
                    </div>
                </div>

                <div class="key-points">
                    <h3>关键点:</h3>
                    <ul id="key-points-list"></ul>
                </div>

                <div class="sequence-progress">
                    <h3>序列进度:</h3>
                    <div id="progress-bar">
                        <div id="progress-indicator"></div>
                    </div>
                    <div id="sequence-steps"></div>
                </div>

                <div id="collection-progress" class="collection-progress hidden">
                    <h3>采集进度:</h3>
                    <div class="progress-info">
                        <span id="current-repeat">0</span> / <span id="total-repeats">5</span> 次
                    </div>
                    <div class="collection-status">
                        状态: <span id="collection-state">准备中</span>
                    </div>
                    <div id="collection-files" class="collection-files">
                        <h4>已采集文件:</h4>
                        <ul id="data-files-list"></ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" disabled>上一个</button>
            <button id="play-btn">播放</button>
            <button id="next-btn" disabled>下一个</button>

            <div class="collection-controls">
                <button id="prepare-collection-btn">准备采集</button>
                <button id="start-collection-btn" disabled>开始采集</button>
                <button id="stop-collection-btn" disabled>停止采集</button>
                <button id="finish-collection-btn" disabled>完成采集</button>
            </div>
        </div>

        <div class="status-panel">
            <div id="status-message">就绪</div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
