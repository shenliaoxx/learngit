<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肌电信号解码方案图</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f5f7fa;
        }
        
        .diagram-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        
        .title {
            text-align: center;
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        svg {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
        }
        
        /* 响应式调整 */
        @media (max-width: 1200px) {
            .diagram-container {
                padding: 20px;
            }
            .title {
                font-size: 24px;
            }
        }
        
        @media (max-width: 768px) {
            .diagram-container {
                padding: 15px;
            }
            .title {
                font-size: 20px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
<div class="diagram-container">
    <div class="title">基于深度学习的肌电信号解码系统</div>
    <svg viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- 渐变定义 -->
            <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3a7bd5"/>
                <stop offset="100%" stop-color="#00d2ff"/>
            </linearGradient>
            <linearGradient id="modelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff758c"/>
                <stop offset="100%" stop-color="#ff7eb3"/>
            </linearGradient>
            
            <!-- 阴影效果 -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#333" flood-opacity="0.2"/>
            </filter>

            <!-- 箭头标记 -->
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/>
            </marker>
            
            <!-- 悬停效果 -->
            <filter id="hoverEffect" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#3498db" flood-opacity="0.5"/>
            </filter>
        </defs>

        <!-- 数据采集部分 -->
        <g transform="translate(50,50)">
            <!-- Myo臂环 -->
            <g class="node" cursor="pointer">
                <rect x="0" y="0" width="160" height="80" rx="10" 
                      fill="url(#dataGradient)" filter="url(#shadow)"/>
                <text x="80" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="500">Myo臂环</text>
                <text x="80" y="55" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">8通道肌电信号</text>
                <rect x="0" y="0" width="160" height="80" rx="10" 
                      fill="transparent" stroke="transparent" stroke-width="2"
                      style="transition: all 0.3s ease;"/>
            </g>

            <!-- RealSense相机 -->
            <g class="node" transform="translate(0,120)" cursor="pointer">
                <rect x="0" y="0" width="160" height="80" rx="10" 
                      fill="url(#dataGradient)" filter="url(#shadow)"/>
                <text x="80" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="500">RealSense相机</text>
                <text x="80" y="55" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">RGB-D数据流</text>
                <rect x="0" y="0" width="160" height="80" rx="10" 
                      fill="transparent" stroke="transparent" stroke-width="2"
                      style="transition: all 0.3s ease;"/>
            </g>

            <!-- MediaPipe处理 -->
            <g class="node" transform="translate(220,60)" cursor="pointer">
                <rect x="0" y="0" width="180" height="100" rx="10" 
                      fill="url(#dataGradient)" filter="url(#shadow)"/>
                <text x="90" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="500">MediaPipe处理</text>
                <text x="90" y="55" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">手部关键点检测</text>
                <text x="90" y="75" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">20个手部角度计算</text>
                <rect x="0" y="0" width="180" height="100" rx="10" 
                      fill="transparent" stroke="transparent" stroke-width="2"
                      style="transition: all 0.3s ease;"/>
            </g>

            <!-- 数据同步 -->
            <g class="node" transform="translate(460,60)" cursor="pointer">
                <rect x="0" y="0" width="160" height="100" rx="10" 
                      fill="url(#dataGradient)" filter="url(#shadow)"/>
                <text x="80" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="500">数据同步</text>
                <text x="80" y="55" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">时间戳对齐</text>
                <text x="80" y="75" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">数据配对</text>
                <rect x="0" y="0" width="160" height="100" rx="10" 
                      fill="transparent" stroke="transparent" stroke-width="2"
                      style="transition: all 0.3s ease;"/>
            </g>

            <!-- 深度学习模型 -->
            <g class="node" transform="translate(680,30)" cursor="pointer">
                <rect x="0" y="0" width="200" height="200" rx="10" 
                      fill="url(#modelGradient)" filter="url(#shadow)"/>
                <text x="100" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="500">深度学习模型</text>
                
                <!-- Encoder部分 -->
                <g transform="translate(20,50)">
                    <rect x="0" y="0" width="160" height="60" rx="5" 
                          fill="rgba(255,255,255,0.15)"/>
                    <text x="80" y="25" text-anchor="middle" fill="white" font-size="14">编码器</text>
                    <text x="80" y="45" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">8通道肌电→低维特征</text>
                </g>

                <!-- Decoder部分 -->
                <g transform="translate(20,120)">
                    <rect x="0" y="0" width="160" height="60" rx="5" 
                          fill="rgba(255,255,255,0.15)"/>
                    <text x="80" y="25" text-anchor="middle" fill="white" font-size="14">解码器</text>
                    <text x="80" y="45" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">低维特征→20个关节角度</text>
                </g>
                <rect x="0" y="0" width="200" height="200" rx="10" 
                      fill="transparent" stroke="transparent" stroke-width="2"
                      style="transition: all 0.3s ease;"/>
            </g>

            <!-- 输出结果 -->
            <g class="node" transform="translate(940,60)" cursor="pointer">
                <rect x="0" y="0" width="160" height="100" rx="10" 
                      fill="#27ae60" filter="url(#shadow)"/>
                <text x="80" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="500">实时角度输出</text>
                <text x="80" y="55" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">20个手部关节角度</text>
                <text x="80" y="75" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">连续预测结果</text>
                <rect x="0" y="0" width="160" height="100" rx="10" 
                      fill="transparent" stroke="transparent" stroke-width="2"
                      style="transition: all 0.3s ease;"/>
            </g>

            <!-- 连接线 -->
            <g stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)">
                <!-- Myo到数据同步 -->
                <path d="M160,40 H200 V110 H220"/>
                <!-- RealSense到MediaPipe -->
                <path d="M160,160 H200 V110 H220"/>
                <!-- MediaPipe到数据同步 -->
                <path d="M400,110 H460"/>
                <!-- 数据同步到模型 -->
                <path d="M620,110 H680"/>
                <!-- 模型到输出 -->
                <path d="M880,110 H940"/>
            </g>
        </g>

        <!-- 图例 -->
        <g transform="translate(50,400)">
            <rect x="0" y="0" width="20" height="20" rx="5" fill="url(#dataGradient)"/>
            <text x="30" y="15" fill="#2c3e50" font-size="14" font-weight="500">数据采集模块</text>
            
            <rect x="150" y="0" width="20" height="20" rx="5" fill="url(#modelGradient)"/>
            <text x="180" y="15" fill="#2c3e50" font-size="14" font-weight="500">深度学习模块</text>
            
            <rect x="300" y="0" width="20" height="20" rx="5" fill="#27ae60"/>
            <text x="330" y="15" fill="#2c3e50" font-size="14" font-weight="500">输出结果</text>
        </g>
    </svg>
</div>

<script>
    // 添加悬停效果
    document.querySelectorAll('.node').forEach(node => {
        node.addEventListener('mouseenter', function() {
            this.querySelector('rect:first-child').setAttribute('filter', 'url(#hoverEffect)');
            this.querySelector('rect:last-child').setAttribute('stroke', '#3498db');
        });
        
        node.addEventListener('mouseleave', function() {
            this.querySelector('rect:first-child').setAttribute('filter', 'url(#shadow)');
            this.querySelector('rect:last-child').setAttribute('stroke', 'transparent');
        });
    });
</script>
</body>
</html>
